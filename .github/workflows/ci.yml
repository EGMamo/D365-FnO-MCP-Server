name: CI

# Branches are tested through their pull request; pushing to master tests the
# merged result. Running on every branch push as well doubled each PR's runs.
on:
  push:
    branches: [master]
  pull_request:

# The jobs only read the repository; keep the token from writing anything.
permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 26 is what the Docker image runs; 24 is the minimum in package.json engines.
        node: ['26']
        include:
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # Gates on high and critical advisories in what ships (runtime deps); moderate
      # ones are left to Dependabot so an upstream advisory does not block every PR.
      - run: npm audit --omit=dev --audit-level=high

  vs-extension:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      # The extension starts the Node gateway for custom models; the end-to-end test runs the built CLI.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: dotnet test vs-extension/tests/D365FnoMcp.Core.Tests
        env:
          D365_E2E_NODE_GATEWAY_COMMAND: node "${{ github.workspace }}/dist/src/index.js"
      - run: dotnet build vs-extension/src/D365FnoMcp.Extension -c Release
      - name: Upload the VSIX
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: vs-extension-vsix
          path: vs-extension/src/D365FnoMcp.Extension/bin/Release/**/*.vsix
          # Releases come from release-vs-extension.yml; a CI build only needs to
          # be downloadable long enough to try it, not the default 90 days.
          retention-days: 7
          if-no-files-found: error

  infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep install
      # bicepconfig.json raises the security rules to errors; any remaining
      # warning also fails the job so the templates stay lint-clean.
      - name: Build and lint the Bicep templates
        env:
          D365_WORKER_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          set -euo pipefail
          cd infra
          az bicep build --file main.bicep --stdout > /dev/null 2> build.log || { cat build.log; exit 1; }
          az bicep build-params --file main.dev.bicepparam --stdout > /dev/null 2>> build.log || { cat build.log; exit 1; }
          az bicep lint --file main.bicep 2>> build.log || { cat build.log; exit 1; }
          cat build.log
          if grep -E 'Warning|Error' build.log; then exit 1; fi

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t d365-fno-mcp-server:ci .
      - name: Smoke test the container
        run: |
          set -euo pipefail
          KEY=$(openssl rand -hex 32)
          docker run -d --name mcp-empty -e MCP_API_KEYS="ci=$KEY" d365-fno-mcp-server:ci
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' mcp-empty)" != "true" ]; then break; fi
            sleep 1
          done
          if [ "$(docker inspect -f '{{.State.Running}}' mcp-empty)" = "true" ]; then
            echo "The container must fail closed when the artifact store is empty."
            exit 1
          fi
          docker logs mcp-empty 2>&1 | grep -q 'no active validated bundle'
          docker run -d --name mcp -p 8080:8080 \
            -e MCP_API_KEYS="ci=$KEY" \
            -e D365_ARTIFACT_STORE_PATH= \
            d365-fno-mcp-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          echo
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          test "$STATUS" = "401"
          curl -fsS -X POST http://127.0.0.1:8080/mcp \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"serverInfo"'
          # The optional SQL Server driver must not be in the image.
          if docker exec mcp test -d node_modules/mssql; then echo "mssql should be omitted" && exit 1; fi
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: d365-fno-mcp-server:ci
          # Fail only on high or critical findings that have a fix available.
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Container logs
        if: always()
        run: |
          docker logs mcp-empty || true
          docker logs mcp || true
      - name: Cleanup
        if: always()
        run: docker rm -f mcp-empty mcp || true

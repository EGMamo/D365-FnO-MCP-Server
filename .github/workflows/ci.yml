name: CI

# Branches are tested through their pull request; pushing to master tests the
# merged result. Running on every branch push as well doubled each PR's runs.
# A pull request runs only the jobs whose files it changes (see `changes`);
# master and manual runs run everything. The weekly run re-checks what can go
# bad without a commit: new advisories against the runtime dependencies and new
# CVEs in the Docker base image.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

# The jobs only read the repository; keep the token from writing anything.
permissions:
  contents: read

# A new push to a pull request supersedes its running checks.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides which jobs a pull request needs. Every rule is a path rule on the
  # files the pull request changes; a change to this workflow runs everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.filter.outputs.server }}
      extension: ${{ steps.filter.outputs.extension }}
      infra: ${{ steps.filter.outputs.infra }}
      docker: ${{ steps.filter.outputs.docker }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      # A pull request is checked out as its merge commit; parent 1 is the base.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          if [ "$EVENT" = schedule ]; then
            for k in server extension infra; do out "$k" false; done
            out docker true; out deps true
            exit 0
          fi
          if [ "$EVENT" != pull_request ]; then
            for k in server extension infra docker deps; do out "$k" true; done
            exit 0
          fi
          files="$(git diff --name-only HEAD^1 HEAD)"
          printf '%s\n' "$files"
          has() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          if [ "$(has '^\.github/workflows/ci\.yml$')" = true ]; then
            for k in server extension infra docker deps; do out "$k" true; done
            exit 0
          fi
          # The Node tests read docs, agents, scripts and infra as well as src,
          # so only a change confined to the VS extension skips them.
          out server "$(grep -qvE '^vs-extension/' <<< "$files" && echo true || echo false)"
          # The extension's end-to-end test runs the built Node gateway.
          out extension "$(has '^(vs-extension/|src/|package(-lock)?\.json$|tsconfig[^/]*\.json$)')"
          out infra "$(has '^infra/')"
          out docker "$(has '^(Dockerfile|\.dockerignore|package(-lock)?\.json|tsconfig(\.build)?\.json)$|^(src|d365-fno-assistant-knowledge)/')"
          out deps "$(has '^package(-lock)?\.json$')"

  build:
    needs: changes
    if: needs.changes.outputs.server == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 26 is what the Docker image runs; 24 is the minimum in package.json engines.
        # Windows is where the stdio server and the VS extension's gateway run.
        node: ['26']
        include:
          - os: ubuntu-latest
            node: '24'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # The npm cache is keyed on the OS and the lockfile only, so the two Ubuntu
      # legs share one entry. Pull request runs restore it but never save: a cache
      # saved from a PR is scoped to that PR's ref, no other run can reuse it, and
      # each Dependabot lockfile bump would otherwise leave dead entries behind
      # until eviction. Master saves a new entry only when the lockfile changes.
      - name: Locate the npm cache
        id: npm-cache
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"
        shell: bash
      - name: Restore the npm cache
        id: npm-restore
        uses: actions/cache/restore@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: npm-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-${{ runner.os }}-
      - run: npm ci
      - name: Save the npm cache
        if: github.event_name == 'push' && steps.npm-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ steps.npm-cache.outputs.dir }}
          key: ${{ steps.npm-restore.outputs.cache-primary-key }}
      - run: npm run check

  # The lockfile decides the result, so a pull request runs it only when the
  # lockfile or package.json changes; the weekly run catches new advisories.
  audit:
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      # Gates on high and critical advisories in what ships (runtime deps); moderate
      # ones are left to Dependabot so an upstream advisory does not block every PR.
      - run: npm audit --omit=dev --audit-level=high

  # Windows only: the extension targets Visual Studio, the VSIX is built there,
  # and the core tests and the gateway end-to-end test run there too. The name
  # keeps the check name the matrix gave it.
  vs-extension:
    name: vs-extension (windows-latest)
    needs: changes
    if: needs.changes.outputs.extension == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      # The extension starts the Node gateway for custom models; the end-to-end test runs the built CLI.
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - run: npm ci
      - run: npm run build
      - run: dotnet test vs-extension/tests/D365FnoMcp.Core.Tests
        env:
          D365_E2E_NODE_GATEWAY_COMMAND: node "${{ github.workspace }}/dist/src/index.js"
      - run: dotnet build vs-extension/src/D365FnoMcp.Extension -c Release
      - name: Upload the VSIX
        # The upload is a convenience for trying a build; the job has already
        # proved the extension builds. A full account artifact quota must not
        # turn the check red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: vs-extension-vsix
          path: vs-extension/src/D365FnoMcp.Extension/bin/Release/**/*.vsix
          # Releases come from release-vs-extension.yml; a CI build only needs to
          # be downloadable long enough to try it, not the default 90 days.
          retention-days: 7
          if-no-files-found: error

  infra:
    needs: changes
    if: needs.changes.outputs.infra == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: az bicep install
      # bicepconfig.json raises the security rules to errors; any remaining
      # warning also fails the job so the templates stay lint-clean.
      - name: Build and lint the Bicep templates
        env:
          D365_WORKER_ADMIN_PASSWORD: ci-placeholder-not-a-secret
        run: |
          set -euo pipefail
          cd infra
          az bicep build --file main.bicep --stdout > /dev/null 2> build.log || { cat build.log; exit 1; }
          az bicep build-params --file main.dev.bicepparam --stdout > /dev/null 2>> build.log || { cat build.log; exit 1; }
          az bicep lint --file main.bicep 2>> build.log || { cat build.log; exit 1; }
          cat build.log
          if grep -E 'Warning|Error' build.log; then exit 1; fi

  docker:
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t d365-fno-mcp-server:ci .
      - name: Smoke test the container
        run: |
          set -euo pipefail
          KEY=$(openssl rand -hex 32)
          docker run -d --name mcp-empty -e MCP_API_KEYS="ci=$KEY" d365-fno-mcp-server:ci
          for _ in $(seq 1 30); do
            if [ "$(docker inspect -f '{{.State.Running}}' mcp-empty)" != "true" ]; then break; fi
            sleep 1
          done
          if [ "$(docker inspect -f '{{.State.Running}}' mcp-empty)" = "true" ]; then
            echo "The container must fail closed when the artifact store is empty."
            exit 1
          fi
          docker logs mcp-empty 2>&1 | grep -q 'no active validated bundle'
          docker run -d --name mcp -p 8080:8080 \
            -e MCP_API_KEYS="ci=$KEY" \
            -e D365_ARTIFACT_STORE_PATH= \
            d365-fno-mcp-server:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/health >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/health
          echo
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/mcp \
            -H 'Content-Type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{}}')
          test "$STATUS" = "401"
          curl -fsS -X POST http://127.0.0.1:8080/mcp \
            -H "X-API-Key: $KEY" -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | grep -q '"serverInfo"'
          # The optional SQL Server driver must not be in the image.
          if docker exec mcp test -d node_modules/mssql; then echo "mssql should be omitted" && exit 1; fi
      - name: Scan the image for vulnerabilities
        uses: anchore/scan-action@v7
        with:
          image: d365-fno-mcp-server:ci
          # Fail only on high or critical findings that have a fix available.
          severity-cutoff: high
          only-fixed: true
          output-format: table
      - name: Container logs
        if: always()
        run: |
          docker logs mcp-empty || true
          docker logs mcp || true
      - name: Cleanup
        if: always()
        run: docker rm -f mcp-empty mcp || true

  # One check that stands for the whole run, for branch protection: a job that
  # a path rule skips passes, a job that fails or is cancelled fails this one.
  ci-ok:
    if: always()
    needs: [changes, build, audit, vs-extension, infra, docker]
    runs-on: ubuntu-latest
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for r in $RESULTS; do
            case "$r" in success|skipped) ;; *) exit 1 ;; esac
          done

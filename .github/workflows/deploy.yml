name: Deploy

# Builds the server image, pushes it to Azure Container Registry, starts it in
# the App Service staging slot, waits for that slot to materialize and validate
# the active artifact bundle onto instance-local disk, smoke-tests it and only
# then swaps it into production. The staging slot is stopped again at the end so
# only production holds a copy of the index between deployments.
# Infrastructure comes from infra/main.bicep.
#
# The environment needs these values, all non-secret outputs of infra/main.bicep:
#   secrets.AZURE_CLIENT_ID  deployClientId (federated identity; no client secret)
#   secrets.AZURE_TENANT_ID, secrets.AZURE_SUBSCRIPTION_ID
#   vars.RESOURCE_GROUP, vars.WEBAPP_NAME, vars.ACR_NAME
#   secrets.MCP_SMOKE_API_KEY  one entry of the API's MCP_API_KEYS secret

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      image_tag:
        description: Image tag to build and deploy (defaults to the commit SHA)
        required: false

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE_NAME: d365-fno-mcp-server
  SLOT: staging

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image tag
        id: tag
        run: echo "tag=${{ github.event.inputs.image_tag || github.sha }}" >> "$GITHUB_OUTPUT"

      - uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve hosts
        id: hosts
        run: |
          echo "production=$(az webapp show -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" --query defaultHostName -o tsv)" >> "$GITHUB_OUTPUT"
          echo "staging=$(az webapp show -g "${{ vars.RESOURCE_GROUP }}" -n "${{ vars.WEBAPP_NAME }}" --slot "$SLOT" --query defaultHostName -o tsv)" >> "$GITHUB_OUTPUT"

      - name: Verify artifact-backed slot configuration
        run: |
          SETTINGS="$(az webapp config appsettings list \
            --resource-group "${{ vars.RESOURCE_GROUP }}" \
            --name "${{ vars.WEBAPP_NAME }}" --slot "$SLOT" \
            --query "[].{name:name,value:value}" -o json)"
          node -e '
            const settings = new Map(JSON.parse(process.argv[1]).map(({name, value}) => [name, value]));
            const required = [
              "D365_ARTIFACT_STORE_PATH",
              "D365_INDEX_DB_PATH",
              "D365_ARTIFACT_ACCOUNT_URL",
              "D365_ARTIFACT_CONTAINER",
              "MCP_API_KEYS",
            ];
            for (const name of required) {
              if (!settings.get(name)) {
                console.error(`Missing required App Service setting: ${name}`);
                process.exitCode = 1;
              }
            }
            // The live SQLite copy must be on instance-local disk, never the /home share.
            if (settings.get("WEBSITES_ENABLE_APP_SERVICE_STORAGE") !== "false") {
              console.error("WEBSITES_ENABLE_APP_SERVICE_STORAGE must be false.");
              process.exitCode = 1;
            }
            if (settings.get("D365_ARTIFACT_SOURCE") !== "azure-blob") {
              console.error("D365_ARTIFACT_SOURCE must be azure-blob so each instance pulls its bundle at startup.");
              process.exitCode = 1;
            }
            if (settings.get("D365_ENABLE_WRITE_TOOLS") !== "0") {
              console.error("D365_ENABLE_WRITE_TOOLS must be 0 for the hosted API.");
              process.exitCode = 1;
            }
          ' "$SETTINGS"

      - name: Sign in to the container registry
        id: acr
        run: |
          az acr login --name "${{ vars.ACR_NAME }}"
          # The deploy identity can push images but not read the registry resource,
          # so `az acr show` finds nothing. Ask the token exchange instead: it returns
          # the login server that `az acr login` just used (only that field is printed).
          SERVER="$(az acr login --name "${{ vars.ACR_NAME }}" --expose-token --only-show-errors --query loginServer -o tsv)"
          if [ -z "$SERVER" ]; then
            echo "::error::Could not resolve the login server of registry ${{ vars.ACR_NAME }}."
            exit 1
          fi
          echo "server=$SERVER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build and push the image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
            ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:latest

      # The last step stops the staging slot between deployments, so start it if it is stopped.
      - name: Start the new image in the staging slot
        id: staging
        env:
          IMAGE: ${{ steps.acr.outputs.server }}/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
        run: |
          # Patch the slot's own site config. `az webapp config container set --slot` and
          # `az webapp config set --slot --linux-fx-version` also rewrite production's app settings
          # (WEBSITES_ENABLE_APP_SERVICE_STORAGE), and an app-settings write restarts production.
          BODY="$(jq -cn --arg fx "DOCKER|$IMAGE" '{properties: {linuxFxVersion: $fx}}')"
          az rest --method patch --output none --body "$BODY" \
            --url "/subscriptions/{subscriptionId}/resourceGroups/${{ vars.RESOURCE_GROUP }}/providers/Microsoft.Web/sites/${{ vars.WEBAPP_NAME }}/slots/$SLOT/config/web?api-version=2023-12-01"
          STATE="$(az webapp show --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.WEBAPP_NAME }}" --slot "$SLOT" --query state -o tsv)"
          if [ "$STATE" = "Running" ]; then
            az webapp restart --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.WEBAPP_NAME }}" --slot "$SLOT"
          else
            az webapp start --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.WEBAPP_NAME }}" --slot "$SLOT"
          fi

      # /health is readiness: it answers 503 until the slot has downloaded,
      # verified and activated the active bundle locally (/live is liveness only).
      - name: Wait for the staging slot to activate its bundle
        run: |
          URL="https://${{ steps.hosts.outputs.staging }}"
          for _ in $(seq 1 180); do
            if curl -fsS "$URL/health" >/dev/null 2>&1; then
              curl -fsS "$URL/health"; echo
              exit 0
            fi
            sleep 10
          done
          echo "The staging slot did not become healthy within 30 minutes." >&2
          exit 1

      - name: Smoke test the staging slot
        env:
          SMOKE_KEY: ${{ secrets.MCP_SMOKE_API_KEY }}
        run: |
          curl -fsS -X POST "https://${{ steps.hosts.outputs.staging }}/mcp" \
            -H "X-API-Key: $SMOKE_KEY" \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json, text/event-stream' \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-smoke","version":"0"}}}' \
            | grep -q '"serverInfo"'

      # Swap warm-up pings /health on the staging instances again
      # (WEBSITE_SWAP_WARMUP_PING_PATH) and aborts the swap if they are not ready.
      - name: Swap staging into production
        run: |
          az webapp deployment slot swap \
            --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.WEBAPP_NAME }}" \
            --slot "$SLOT" --target-slot production

      - name: Verify production, or swap back
        run: |
          URL="https://${{ steps.hosts.outputs.production }}"
          for _ in $(seq 1 30); do
            if curl -fsS "$URL/health" >/dev/null 2>&1; then
              curl -fsS "$URL/health"; echo
              exit 0
            fi
            sleep 10
          done
          echo "Production did not report healthy after the swap; swapping back." >&2
          az webapp deployment slot swap \
            --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.WEBAPP_NAME }}" \
            --slot "$SLOT" --target-slot production
          exit 1

      # Each instance's 15 GB host disk is shared by both slots, and a running slot
      # holds a full copy of the index. Staging now holds the previous release (or
      # a candidate that failed), so stop it until the next deployment starts it.
      # If production is unhealthy (a swap back failed), leave staging running for
      # a manual swap. infra/README.md "Deployment and rollback" has the steps.
      - name: Stop the staging slot to free its disk
        if: always() && steps.staging.outcome != 'skipped'
        run: |
          if curl -fsS --max-time 30 "https://${{ steps.hosts.outputs.production }}/health" >/dev/null 2>&1; then
            az webapp stop --resource-group "${{ vars.RESOURCE_GROUP }}" --name "${{ vars.WEBAPP_NAME }}" --slot "$SLOT"
          else
            echo "::warning::Production is not healthy, so the staging slot stays running for a manual swap."
          fi
